u044F\u0437\u0430\u0442\u044C\u0441\u044F \u0441 \u043A\u043B\u0438\u0435\u043D\u0442\u043E\u043C, \u0443\u0442\u043E\u0447\u043D\u0438\u0442\u044C \u043F\u0440\u043E\u0431\u043B\u0435\u043C\u044B \u0441 \u0434\u043E\u0441\u0442\u0443\u043F\u043E\u043C \u043A \u0418\u043D\u0442\u0435\u0440\u043D\u0435\u0442-\u0431\u0430\u043D\u043A\u0443, \u0440\u0430\u0431\u043E\u0442\u0435 \u0431\u0430\u043D\u043A\u043E\u043C\u0430\u0442\u043E\u0432, \u0440\u0435\u0435\u0441\u0442\u0440\u0430\u043C \u0438 \u043F\u0440\u043E\u0434\u0443\u043A\u0442\u0443 \xAB\u0424\u0438\u043A\u0441\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0439 \u043E\u0441\u0442\u0430\u0442\u043E\u043A\xBB, \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0438\u0442\u044C \u0430\u043B\u044C\u0442\u0435\u0440\u043D\u0430\u0442\u0438\u0432\u043D\u044B\u0435 \u043A\u0430\u043D\u0430\u043B\u044B \u0441\u0432\u044F\u0437\u0438 \u0438 \u043F\u0435\u0440\u0435\u0434\u0430\u0442\u044C \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u043D\u0443\u044E \u043E\u0431\u0440\u0430\u0442\u043D\u0443\u044E \u0441\u0432\u044F\u0437\u044C \u0432 \u0431\u0430\u043D\u043A."),G("UA85XU",5,"\u041B\u043E\u044F\u043B\u044C\u043D\u044B\u0439","\u0417\u0430 \u043F\u0435\u0440\u0438\u043E\u0434 \u043D\u0430\u0431\u043B\u044E\u0434\u0430\u0435\u0442\u0441\u044F \u0438\u0441\u043A\u043B\u044E\u0447\u0438\u0442\u0435\u043B\u044C\u043D\u043E \u043F\u043E\u043B\u043E\u0436\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0439 \u0441\u0438\u0433\u043D\u0430\u043B: \u0432\u0441\u0435 8 \u043E\u0446\u0435\u043D\u043E\u043A \u2013 5, \u043D\u0435\u0442 \u043D\u0435\u0433\u0430\u0442\u0438\u0432\u043D\u044B\u0445 \u043E\u0446\u0435\u043D\u043E\u043A \u0438 \u043F\u0440\u0435\u0442\u0435\u043D\u0437\u0438\u0439.","\u041A\u043B\u0438\u0435\u043D\u0442 \u043E\u0446\u0435\u043D\u0438\u043B \u043D\u0430 5 \u043A\u0430\u043D\u0430\u043B \xAB\u0418\u043D\u0442\u0435\u0440\u043D\u0435\u0442-\u0411\u0430\u043D\u043A\xBB, \u0441\u0435\u0440\u0432\u0438\u0441\u044B \xAB\u0420\u0435\u0435\u0441\u0442\u0440\u044B\xBB, \xAB\u0420\u0443\u0431\u043B\u0435\u0432\u044B\u0435 \u043F\u043B\u0430\u0442\u0435\u0436\u0438\xBB, \xAB\u0412\u044B\u043F\u0438\u0441\u043A\u0430\xBB, \u0430 \u0442\u0430\u043A\u0436\u0435 \u0441\u0435\u0440\u0432\u0438\u0441 \xAB\u0421\u0435\u0440\u0432\u0438\u0441 \u041F\u0438\u0441\u044C\u043C\u0430\xBB (\u043F\u0440\u043E\u0434\u0443\u043A\u0442 \xAB\u0412\u0430\u043B\u044E\u0442\u043D\u044B\u0439 \u043A\u043E\u043D\u0442\u0440\u043E\u043B\u044C\xBB).","\u041D\u0435\u0433\u0430\u0442\u0438\u0432\u043D\u044B\u0435 VoC-\u0441\u0438\u0433\u043D\u0430\u043B\u044B \u0437\u0430 \u043F\u0435\u0440\u0438\u043E\u0434 \u043D\u0435 \u0432\u044B\u044F\u0432\u043B\u0435\u043D\u044B.","\u041F\u0440\u0435\u0442\u0435\u043D\u0437\u0438\u0438 \u0437\u0430 \u043F\u0435\u0440\u0438\u043E\u0434 \u043D\u0435 \u0432\u044B\u044F\u0432\u043B\u0435\u043D\u044B.","\u041D\u0430\u0447\u0430\u0442\u044C \u0440\u0430\u0437\u0433\u043E\u0432\u043E\u0440 \u0441 \u0431\u043B\u0430\u0433\u043E\u0434\u0430\u0440\u043D\u043E\u0441\u0442\u0438 \u0437\u0430 \u0432\u044B\u0441\u043E\u043A\u0438\u0435 \u043E\u0446\u0435\u043D\u043A\u0438 \u0432\u0441\u0435\u0445 \u043A\u0430\u043D\u0430\u043B\u043E\u0432 \u0438 \u0441\u0435\u0440\u0432\u0438\u0441\u043E\u0432, \u043F\u043E\u0434\u0447\u0435\u0440\u043A\u043D\u0443\u0442\u044C \u0443\u0434\u043E\u0431\u0441\u0442\u0432\u043E \u0438 \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u044C \u0440\u0430\u0431\u043E\u0442\u044B \xAB\u0418\u043D\u0442\u0435\u0440\u043D\u0435\u0442-\u0411\u0430\u043D\u043A\u0430\xBB \u0438 \xAB\u0420\u0435\u0435\u0441\u0442\u0440\u043E\u0432\xBB, \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0438\u0442\u044C \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0442\u044C \u0442\u0435\u043A\u0443\u0449\u0438\u0439 \u0443\u0440\u043E\u0432\u0435\u043D\u044C \u0441\u0435\u0440\u0432\u0438\u0441\u0430."),G("UA9771",5,"\u041B\u043E\u044F\u043B\u044C\u043D\u044B\u0439","\u0417\u0430
